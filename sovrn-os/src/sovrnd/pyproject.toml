[project]
name = "sovrnd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tomli>=2.0",
    "pynacl>=1.5",
    "podman>=4.0",
    "PyJWT>=2.8",
    "websockets>=12.0",
]

[project.scripts]
sovrnd = "sovrnd.__main__:main"

[tool.setuptools.packages.find]
include = ["sovrnd*"]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"
