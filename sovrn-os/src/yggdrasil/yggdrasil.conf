
# Sovrn OS Yggdrasil Mesh Configuration
# Per doc 28: Port 30550, .sovrn TLD routing

{
    # Auto-generate keys on first run
    AdminListen: unix:///var/run/yggdrasil/yggdrasil.sock

    # Listen for peer connections
    Listen: [
        "tls://0.0.0.0:30550"
    ]

    # Public peers for bootstrapping (Sovrn community nodes)
    Peers: [
        "tls://sovrn-mesh-1.example.com:30550"
    ]

    # Interface settings
    IfName: yggdrasil

    # Session firewall
    SessionFirewall: {
        Enable: true
        AllowFromDirect: true
        AllowFromRemote: true
        AllowInToDestinations: []
        AllowOutToSources: []
    }

    # Tunnel routing (for .sovrn TLD)
    TunnelRouting: {
        Enable: true
        IPv6Destinations: {}
        IPv6Sources: {}
        IPv4Destinations: {}
        IPv4Sources: {}
    }

    # Node info
    NodeInfo: {
        name: "sovrn-os-node"
        version: "0.1.0"
    }

    # Network options
    SwitchOptions: {
        MaxTotalQueueSize: 4194304
    }
}
