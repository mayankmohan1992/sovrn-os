# Sovrn OS GNOME Desktop Customizations
# Applied via dconf system-db:sovrn

[org/gnome/desktop/interface]
gtk-theme='Adwaita-dark'
icon-theme='Adwaita'
color-scheme='prefer-dark'
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='JetBrains Mono 10'
clock-show-weekday=true
clock-format='24h'

[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/sovrn/sovrn-default.png'
picture-uri-dark='file:///usr/share/backgrounds/sovrn/sovrn-default-dark.png'
picture-options='zoom'
primary-color='#111827'
secondary-color='#0D9488'

[org/gnome/desktop/screensaver]
picture-uri='file:///usr/share/backgrounds/sovrn/sovrn-screensaver.png'

[org/gnome/desktop/wm/preferences]
button-layout='close,minimize,maximize:appmenu'
titlebar-font='Inter 11'

[org/gnome/desktop/peripherals/mouse]
accel-profile='flat'

[org/gnome/desktop/peripherals/touchpad]
tap-to-click=true
natural-scroll=true

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'in+eng'), ('xkb', 'in+hin')]
xkb-options=['lv3:ralt_switch', 'compose:rctrl']

[org/gnome/shell]
enabled-extensions=['sovrn-indicator@sovrn.os', 'appindicatorsupport@rgcjonas.gmail.com']
favorite-apps=['org.gnome.Console.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Software.desktop', 'sovrn-hub.desktop', 'org.gnome.Settings.desktop']

[org/gnome/shell/extensions/sovrn-indicator]
show-mesh-status=true
show-yggdrasil-address=true
show-online-peers=true

[org/gnome/nautilus/preferences]
default-folder-view-mode='list-view'
show-hidden-files=true

[org/gnome/terminal/legacy/profiles:/]
list=['sovrn']

[org/gnome/terminal/legacy/profiles/:sovrn]
visible-name='Sovrn'
foreground-color='rgb(249,250,251)'
background-color='rgb(17,24,39)'
use-theme-colors=false
use-theme-transparency=false
use-transparent-background=true
background-transparency-percent=5
font='JetBrains Mono 10'
scrollback-lines=10000

[org/gnome/software]
check-updates-frequency=86400
first-run=false

[org/gnome/desktop/notifications]
show-banners=true
