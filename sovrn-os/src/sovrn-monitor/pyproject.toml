[project]
name = "sovrn-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.scripts]
sovrn-monitor = "sovrn_monitor.__main__:main"

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"
