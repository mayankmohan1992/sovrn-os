
# Sovrn OS Unbound DNS resolver
# Resolves .sovrn TLD via Yggdrasil mesh, everything else via upstream

server:
    # Listen on localhost
    interface: 127.0.0.1
    interface: ::1
    port: 5353

    # Access control
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow

    # Do not recurse .sovrn — forward to DHT
    domain-insecure: "sovrn"

    # Enable DNS-over-TLS for upstream
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    # Performance
    num-threads: 2
    msg-cache-size: 32m
    rrset-cache-size: 32m
    cache-min-ttl: 300
    cache-max-ttl: 86400

# Forward .sovrn queries to local DHT service
# (Not a real DNS server — resolved programmatically by sovrnd)
forward-zone:
    name: "sovrn"
    forward-addr: 127.0.0.1@54771  # sovrnd handles DNS-over-API

# Forward everything else to upstream DNS
forward-zone:
    name: "."
    forward-addr: 1.1.1.1@853      # Cloudflare DoT
    forward-addr: 9.9.9.9@853       # Quad9 DoT
    forward-tls-upstream: yes
