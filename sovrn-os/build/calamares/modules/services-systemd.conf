# Sovrn OS systemd services to enable/disable during install
---
services:
    enable:
        - sovrn.target
        - sovrnd.service
        - sovrn-dht.service
        - sovrn-identity.service
        - sovrn-presence.service
        - sovrn-feed.service
        - sovrn-message-queue.service
        - sovrn-auth.service
        - sovrn-monitor.service
        - sovrn-notify-bridge.service
        - sovrn-cdn-agent.service
        - yggdrasil.service
        - NetworkManager.service
        - gdm.service
        - nftables.service
        - unbound.service
        - caddy.service
    disable:
        - avahi-daemon.service
        - cups.service
        - bluetooth.service
