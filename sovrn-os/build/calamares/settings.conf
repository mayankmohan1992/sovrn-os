# Sovrn OS Calamares Installer Configuration
#
# This config is embedded in the live ISO and launched
# as an alternative to the OOBE wizard.

---
# YAML format
modules-search: [ local ]

sequences:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - sources-media
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - packages
      - luksbootkeyfile
      - plasmalook
      - plymouthcfg
      - initramfscfg
      - initramfs
      - unfreeze
  - show:
      - finished

branding: sovrn

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
