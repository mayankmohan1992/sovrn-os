[workspace]
resolver = "2"
members = [
    "src/sovrn-dht",
    "src/sovrn-identity",
    "src/sovrn-presence",
    "src/sovrn-feed",
    "src/sovrn-message-queue",
    # "src/oobe",  # Skipped: GTK4 needs Linux build env. See BUILD-ERROR-LOG.md
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ed25519-dalek = { version = "2", features = ["serde"] }
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
anyhow = "1"
hex = "0.4"
thiserror = "1"
bytes = "1"
sd-notify = "0.4"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
