name: Build Sovrn OS Hybrid Image

on:
  push:
    branches: [main, feature/ci-*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Hybrid Disk Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          # Remove stale Microsoft repos that return 403 on some runners
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y \
            debos \
            parted \
            grub-pc-bin \
            grub-efi-amd64-bin \
            xorriso \
            mtools \
            dosfstools \
            e2fsprogs \
            util-linux \
            qemu-system-x86 \
            qemu-utils \
            python3-pip \
            npm \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: sovrn-os/src/sovrn-cdn-agent/go.sum

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build all components from source
        working-directory: sovrn-os
        run: |
          bash scripts/build.sh all

      - name: Restore cached rootfs tarball
        id: cache-rootfs
        uses: actions/cache@v4
        with:
          path: sovrn-os/build/sovrn-os-rootfs.tar.gz
          key: rootfs-${{ hashFiles('sovrn-os/build/debos-sovrn-ci.yaml', 'sovrn-os/src/systemd-units/*', 'sovrn-os/build/overlays/**') }}
          restore-keys: |
            rootfs-

      - name: Build rootfs tarball (debos)
        if: steps.cache-rootfs.outputs.cache-hit != 'true'
        working-directory: sovrn-os
        run: |
          sudo ./build/build-iso.sh --quick

      - name: Verify rootfs tarball exists
        working-directory: sovrn-os
        run: |
          ls -la build/sovrn-os-rootfs.tar.gz || {
            echo "Rootfs tarball not found! Trying to rebuild..."
            sudo ./build/build-iso.sh --quick
          }

      - name: Run image builder with diagnostics
        working-directory: sovrn-os
        run: |
          set -x
          bash -x ./build/build-iso-image.sh 2>&1 || true
          echo "--- exit code: $? ---"

      - name: Quick smoke test
        working-directory: sovrn-os
        run: |
          echo "### Boot test with QEMU" >> $GITHUB_STEP_SUMMARY
          timeout 30 qemu-system-x86_64 \
            -m 256 -enable-kvm -cpu host -nographic \
            -drive file=build/sovrn-os-hybrid.img,format=raw \
            -serial mon:stdio 2>&1 || true
          echo "- Smoke test completed" >> $GITHUB_STEP_SUMMARY

      - name: Upload hybrid image artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovrn-os-hybrid
          path: sovrn-os/build/sovrn-os-hybrid.img
          retention-days: 30

      - name: Print build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          du -sh sovrn-os/build/sovrn-os-hybrid.img | while read size name; do
            echo "- Image: \`sovrn-os-hybrid.img\` (${size})" >> $GITHUB_STEP_SUMMARY
          done
          echo "- Flash to USB: \`sudo dd if=sovrn-os-hybrid.img of=/dev/sdX bs=4M status=progress\`" >> $GITHUB_STEP_SUMMARY
          echo "- Test with QEMU: \`qemu-system-x86_64 -m 2048 -enable-kvm -cpu host -drive file=sovrn-os-hybrid.img,format=raw\`" >> $GITHUB_STEP_SUMMARY
